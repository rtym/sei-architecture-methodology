name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: everything except the diagram render smoke test.
  # Needs only Python + bash, so it finishes in seconds.
  tests:
    name: test suite (no renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run test suite
        run: bash tests/run.sh --quick

  # Full suite including the Mermaid render smoke test. Split out because it
  # pulls a headless Chromium (~150 MB), which is by far the slowest part.
  render:
    name: full suite (Mermaid renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # no npm cache: package-lock.json is intentionally gitignored,
          # so there is no lockfile for setup-node to key a cache on.

      # The Chromium download dominates this job; cache it across runs.
      - name: Cache puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('skills/sei-diagrams/package.json') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - name: Install the Mermaid renderer
        run: bash skills/sei-diagrams/scripts/setup.sh

      # tests/run.sh SKIPS the render step (without failing) when mmdc is absent,
      # so assert it is really there — otherwise this job could pass green while
      # never having rendered anything.
      - name: Verify the renderer is installed
        run: |
          test -x skills/sei-diagrams/node_modules/.bin/mmdc \
            || { echo "mmdc missing — the render smoke test would silently skip"; exit 1; }

      - name: Run full test suite
        run: bash tests/run.sh

  # PlantUML is the other half of the diagram toolchain (true-UML use cases, canonical C4).
  # Split from the Mermaid job so a failure names which renderer broke, and so the two run in
  # parallel. tests/run.sh step 8 renders from a temp dir OUTSIDE the repo, which is the only
  # way a '../'-traversal !include regression shows up.
  plantuml:
    name: full suite (PlantUML renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlantUML (pulls a JRE)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends plantuml

      # tests/run.sh SKIPS step 8 (without failing) when java or plantuml is absent, so assert
      # both are really there — otherwise this job could pass green having rendered nothing.
      - name: Verify the renderer is installed
        run: |
          command -v java     || { echo "java missing — the PlantUML smoke test would skip"; exit 1; }
          command -v plantuml || { echo "plantuml missing — the PlantUML smoke test would skip"; exit 1; }

      - name: Run full test suite
        run: bash tests/run.sh

      # Belt and braces: render every shipped example .puml for real. The smoke test proves the
      # include path works; this proves the 21 committed diagrams still compile.
      - name: Render every example diagram
        run: |
          set -e
          for d in $(git ls-files 'examples/**/*.puml' | xargs -n1 dirname | sort -u); do
            bash skills/sei-diagrams/scripts/render-plantuml.sh --out "$RUNNER_TEMP/puml" "$d"
          done
          n=$(find "$RUNNER_TEMP/puml" -name '*.png' | wc -l)
          echo "rendered $n diagram(s)"
          [ "$n" -ge 21 ] || { echo "expected at least 21 PNGs, got $n"; exit 1; }
